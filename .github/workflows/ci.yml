name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  native-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S tests/native -B build-native
          cmake --build build-native
          ctest --test-dir build-native --output-on-failure
  stm32f7-modules:
    runs-on: ubuntu-latest
    container:
      image: chocotechnologies/dmod:1.0.4
    steps:
      - uses: actions/checkout@v4
      # Temporary source dependency until dmclk 1.2 is released.
      - uses: actions/checkout@v4
        with:
          repository: choco-technologies/dmclk
          ref: 7139bb340c0975037013ea4fa130b269aaba9d3f
          path: dependencies/dmclk
      - run: |
          set -e
          cmake -S dependencies/dmclk -B build-clock -DDMOD_MODULE_VERSION=1.2
          cmake --build build-clock --target dmclk dmclk_port
          cmake -S . -B build -DDMOD_CPU_FAMILY=stm32f7 -DDMSAI_DMCLK_INCLUDE_DIR="$PWD/build-clock/packages/dmclk/include"
          cmake --build build
          test -f build/dmf/dmsai.dmf
          test -f build/dmf/dmsai_port.dmf
          test -f build/dmf/dmsai_hardware_test.dmf
