; Pin-agnostic SAI2 stereo default for STM32F746NG.
; Route pins and configure any codec separately for the selected board.
; SAI1 is index 0, SAI2 is index 1.
; The SAI node is created by dmdevfs when this section is loaded.

[dmsai]
driver_name=dmsai
instance=1
clock_role=master
framing=i2s
pcm_format=s16_le
sample_rate_hz=48000
tolerance_ppm=500
slot_bits=16
slot_count=2
frame_bits=32
active_slots=3
transmit=on
receive=off
