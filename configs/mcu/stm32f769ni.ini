; Pin-agnostic SAI1 stereo default for STM32F769NI.
; Route pins and configure any codec separately for the selected board.
; SAI1 is index 0 in the proposed zero-based API.
; The dmsai driver is currently a stub.

[dmsai]
driver_name=dmsai
instance=0
clock_role=master
framing=i2s
pcm_format=s16_le
sample_rate_hz=48000
tolerance_ppm=500
slot_bits=16
slot_count=2
frame_bits=32
active_slots=3
transmit=on
receive=off
