; STM32F769I-DISCOVERY: WM8994 is wired to SAI1 A/B.
; Pins and AF6: ST 32f769idiscovery-bsp/stm32f769i_discovery_audio.h
; https://github.com/STMicroelectronics/32f769idiscovery-bsp/blob/main/stm32f769i_discovery_audio.h
; ST's output BSP uses a 128-bit frame with four 16-bit slots. Its RX
; example uses a different frame length, so this configuration enables TX only.
; Codec setup is separate. The SAI node is created by dmdevfs when this section is loaded.

[sai1_mclk]
driver_name=dmgpio
driver_order=10
friends_group=sai1
pin=PG7
mode=alternate
alternate_function=6
speed=maximum
output_circuit=push_pull
pull=none

[sai1_fs]
driver_name=dmgpio
driver_order=10
friends_group=sai1
pin=PE4
mode=alternate
alternate_function=6
speed=maximum
output_circuit=push_pull
pull=none

[sai1_sck]
driver_name=dmgpio
driver_order=10
friends_group=sai1
pin=PE5
mode=alternate
alternate_function=6
speed=maximum
output_circuit=push_pull
pull=none

[sai1_tx]
driver_name=dmgpio
driver_order=10
friends_group=sai1
pin=PE6
mode=alternate
alternate_function=6
speed=maximum
output_circuit=push_pull
pull=none

[sai1]
driver_name=dmsai
driver_order=11
friends_group=sai1
instance=0
clock_role=master
framing=tdm
pcm_format=s16_le
sample_rate_hz=48000
tolerance_ppm=500
slot_bits=16
slot_count=4
frame_bits=128
active_slots=5
transmit=on
receive=off
