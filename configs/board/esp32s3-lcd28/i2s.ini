; Waveshare ESP32-S3-Touch-LCD-2.8: the PCM5101 DAC (the speaker / headphone output) on I2S0: DOUT = GPIO47, BCLK = GPIO48, LRC (WS) = GPIO38
; (Waveshare demo code). The DAC has no registers and wants no MCLK (its PLL takes the bit clock). The pads are routed by the port
; (the GPIO matrix): no dmgpio sections. 32-bit slots, a 16-bit client sample sits at the top of the slot. Select this file OR i2s-loopback.ini.
; The node is /dev/dmsai0 (saitone plays a sine through it).

[i2s0]
driver_name=dmsai
driver_order=11
instance=0
clock_role=master
framing=i2s
pcm_format=s16_le
sample_rate_hz=48000
tolerance_ppm=500
slot_bits=32
slot_count=2
frame_bits=64
active_slots=3
transmit=on
receive=off
bclk_pin=48
ws_pin=38
dout_pin=47
