; The same controller and pins as i2s.ini, with the receiver on: the data pad is routed to the transmitter and the receiver both
; (din_pin = dout_pin), so what the node plays comes back through its own read(): `saitone /dev/dmsai0 1000 3 loop` checks the whole
; path (the clock, the DMA both ways, the framing) without a wire. The DAC plays the tone as well.

[i2s0]
driver_name=dmsai
driver_order=11
instance=0
clock_role=master
framing=i2s
pcm_format=s16_le
sample_rate_hz=48000
tolerance_ppm=500
slot_bits=32
slot_count=2
frame_bits=64
active_slots=3
transmit=on
receive=on
bclk_pin=48
ws_pin=38
dout_pin=47
din_pin=47
