; LILYGO T-Deck Pro (the PCM5102A SKU): the PCM5102A DAC on I2S0, the line output goes to the 3.5 mm jack (no speaker amplifier):
; DIN = GPIO8, BCK = GPIO7, LRCK = GPIO9 (T-HeadJack schematic; SCK of the DAC is tied to GND, its PLL takes the bit clock, so no MCLK).
; The DAC is powered by the boost converter that GPIO41 (6609_EN) enables: [dac_power] holds it high before the stream (dmgpio must
; be loaded, GPIO41 = PC9: GPIO0..15 are port A, 16..31 port B, 32..47 port C). The pads of the I2S are routed by the port (the GPIO matrix).
; The node is /dev/dmsai0 (saitone plays a sine through it). 32-bit slots, a 16-bit client sample sits at the top of the slot.

[dac_power]
driver_name=dmgpio
driver_order=2
pin=PC9
mode=output
state=high

[i2s0]
driver_name=dmsai
driver_order=11
instance=0
clock_role=master
framing=i2s
pcm_format=s16_le
sample_rate_hz=48000
tolerance_ppm=500
slot_bits=32
slot_count=2
frame_bits=64
active_slots=3
transmit=on
receive=off
bclk_pin=7
ws_pin=9
dout_pin=8
