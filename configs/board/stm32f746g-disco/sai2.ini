; 32F746GDISCOVERY: WM8994 is wired to SAI2 A/B.
; Pins and AF10: ST 32f746gdiscovery-bsp/stm32746g_discovery_audio.h
; https://github.com/STMicroelectronics/32f746gdiscovery-bsp/blob/main/stm32746g_discovery_audio.h
; Four 16-bit TDM slots and a 64-bit frame follow ST's audio BSP.
; Codec setup is separate. The SAI node is created by dmdevfs when this section is loaded.

[sai2_mclk]
driver_name=dmgpio
driver_order=10
friends_group=sai2
pin=PI4
mode=alternate
alternate_function=10
speed=maximum
output_circuit=push_pull
pull=none

[sai2_sck]
driver_name=dmgpio
driver_order=10
friends_group=sai2
pin=PI5
mode=alternate
alternate_function=10
speed=maximum
output_circuit=push_pull
pull=none

[sai2_tx]
driver_name=dmgpio
driver_order=10
friends_group=sai2
pin=PI6
mode=alternate
alternate_function=10
speed=maximum
output_circuit=push_pull
pull=none

[sai2_fs]
driver_name=dmgpio
driver_order=10
friends_group=sai2
pin=PI7
mode=alternate
alternate_function=10
speed=maximum
output_circuit=push_pull
pull=none

[sai2_rx]
driver_name=dmgpio
driver_order=10
friends_group=sai2
pin=PG10
mode=alternate
alternate_function=10
speed=maximum
output_circuit=push_pull
pull=none

[sai2]
driver_name=dmsai
driver_order=11
friends_group=sai2
instance=1
clock_role=master
framing=tdm
pcm_format=s16_le
sample_rate_hz=48000
tolerance_ppm=500
slot_bits=16
slot_count=4
frame_bits=64
active_slots=5
transmit=on
receive=on
